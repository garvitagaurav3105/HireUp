<div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
</div>

<header class="site-header">
    <div class="container header-inner">
        <a href="{{ url_for('index') }}" class="brand">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" width="34" height="34" role="img">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e0546b"/>
                            <stop offset="55%" stop-color="#a3283a"/>
                            <stop offset="100%" stop-color="#5c1620"/>
                        </linearGradient>
                    </defs>
                    <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#logoGrad)"/>
                    <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" fill="none" stroke="rgba(255,255,255,0.28)"/>
                    <path d="M17 22v-2.5a5 5 0 0110 0V22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
                    <rect x="12" y="22" width="24" height="15" rx="3.5" fill="#fff"/>
                    <rect x="20.5" y="27.5" width="7" height="4" rx="1.4" fill="url(#logoGrad)"/>
                </svg>
            </span>
            <span class="brand-word">Hire<span>Up</span></span>
        </a>

        <form class="lang-form" action="{{ url_for('set_language') }}" method="get">
            <label class="sr-only" for="lang-select">{{ t('nav_language') }}</label>
            <select id="lang-select" name="lang" onchange="this.form.submit()">
                {% for code, name in languages.items() %}
                    <option value="{{ code }}"{{ ' selected' if code == current_lang }}>{{ name }}</option>
                {% endfor %}
            </select>
            <input type="hidden" name="next" value="{{ request.full_path }}">
            <button type="submit" class="lang-go">{{ t('lang_apply') }}</button>
        </form>
    </div>
</header>
