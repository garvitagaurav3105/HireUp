<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HireUp — {{ t('home_tagline') }}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "_header.html" %}

    <main class="container">
        <section class="hero">
            <h1 class="tagline">{{ t('home_tagline') }}</h1>
            <p class="description">{{ t('home_intro') }}</p>

            <form class="search-card" action="/search" method="get">
                <div class="form-row">
                    <div class="form-field">
                        <label for="profession">{{ t('field_profession') }}</label>
                        <div class="field-input">
                            <select id="profession" name="profession">
                                <option value="Software / IT">Software / IT</option>
                                <option value="Data Science">Data Science</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Finance">Finance</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Design">Design</option>
                                <option value="Research">Research</option>
                                <option value="Policy">Policy</option>
                                <option value="Sales">Sales</option>
                                <option value="Operations">Operations</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                            </select>
                            <!-- Shown by script.js only when the browser supports speech recognition -->
                            <button type="button" class="btn-mic" data-target="profession"
                                    aria-label="Choose profession by voice" hidden>
                                <span aria-hidden="true">🎤</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="location">{{ t('field_location') }}</label>
                        <div class="field-input">
                            <input type="text" id="location" name="location"
                                   placeholder="{{ t('field_location_ph') }}">
                            <button type="button" class="btn-mic" data-target="location"
                                    aria-label="Enter location by voice" hidden>
                                <span aria-hidden="true">🎤</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-search">{{ t('btn_search') }}</button>
                    <p class="voice-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    {% include "_footer.html" %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
