<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HireUp — {{ t('home_tagline') }}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body data-welcome-text="{{ t('welcome_speech') }}" data-welcome-lang="{{ current_lang }}">
    {% include "_header.html" %}

    <main class="container">
        <section class="hero">
            <div class="hero-3d" aria-hidden="true">
                <span class="float-card fc-1"></span>
                <span class="float-card fc-2"></span>
                <span class="float-card fc-3"></span>
            </div>

            <h1 class="tagline">{{ t('home_tagline') }}</h1>
            <p class="description">{{ t('home_intro') }}</p>

            <form class="search-card" action="/search" method="get">
                <div class="form-row">
                    <div class="form-field">
                        <label for="profession">{{ t('field_profession') }}</label>
                        <div class="field-input">
                            <select id="profession" name="profession">
                                {% for option in professions %}
                                    <option value="{{ option }}">{{ option }}</option>
                                {% endfor %}
                            </select>
                            <!-- Shown by script.js only when the browser supports speech recognition -->
                            <button type="button" class="btn-mic" data-target="profession"
                                    aria-label="Choose profession by voice" hidden>
                                <span aria-hidden="true">🎤</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="location">{{ t('field_location') }}</label>
                        <div class="field-input">
                            <input type="text" id="location" name="location"
                                   placeholder="{{ t('field_location_ph') }}">
                            <button type="button" class="btn-mic" data-target="location"
                                    aria-label="Enter location by voice" hidden>
                                <span aria-hidden="true">🎤</span>
                            </button>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="min-salary">{{ t('field_salary') }}</label>
                        <input type="number" id="min-salary" name="min_salary" min="0" step="10000"
                               inputmode="numeric" placeholder="{{ t('field_salary_ph') }}">
                    </div>

                    <div class="form-field">
                        <label for="job-type">{{ t('field_job_type') }}</label>
                        <select id="job-type" name="job_type">
                            <option value="">{{ t('job_type_any') }}</option>
                            {% for option in job_types %}
                                <option value="{{ option }}">{{ t('job_type_' ~ option) }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-search">{{ t('btn_search') }}</button>
                    <p class="voice-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    {% include "_footer.html" %}

    <script src="{{ url_for('static', filename='script.js') }}?v={{ asset_version }}"></script>
</body>
</html>
